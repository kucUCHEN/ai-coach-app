<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI健康教練</title>
  <meta name="description" content="住在手機裡的 AI 健康教練">
  <meta name="theme-color" content="#f5f6f7">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone 加到主畫面 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI健康教練">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/food.css">
  <link rel="stylesheet" href="css/exercise.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">AI健康教練</h1>
    <a class="icon-btn" href="#settings" aria-label="設定"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="主要分頁">
    <a href="#coach"    data-route="coach"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3.5 21l1.4-4.9A8.5 8.5 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span>教練</span></a>

  </nav>

  <script type="module" src="js/main.js"></script>
